# Run from repository root: ojob docs/guides/index.yaml
# All nine sections are generated from Markdown front matter.
todo:
- Generate guide indexes
jobs:
- name: Generate guide indexes
  exec: |
    var script = io.fileExists("utils/gen_indexes.py") ? "utils/gen_indexes.py" : "../../utils/gen_indexes.py";
    var result = $sh("python3 " + script).get(0);
    if (result.stdout) printnl(result.stdout);
    if (result.stderr) printErrnl(result.stderr);
    if (result.exitcode != 0) throw "Guide index generation failed: " + result.exitcode;
