# Compatibility entry point. Run from the documentation repository root.
help:
  text: Regenerate pinned source documentation with utils/sync_docs.py.
  expects:
  - name: sources
    desc: Directory prepared by utils/prepare_sources.py
    mandatory: true
  - name: output
    desc: Site repository root (not a section directory); defaults to current directory
  - name: runtime
    desc: OpenAF executable or JAR used to parse source ODoc; defaults to oaf

todo:
- Generate documentation

jobs:
- name: Generate documentation
  check:
    in:
      sources: isString
      output: isString.default(".")
      runtime: isString.default("oaf")
  exec: |
    var quote = s => "'" + String(s).replace(/'/g, "'\\''") + "'";
    var command = ["python3", "utils/sync_docs.py", "--only", "reference",
                   "--sources", args.sources, "--output", args.output, "--runtime", args.runtime];
    var result = $sh(command.map(quote).join(" ")).get(0);
    if (result.stdout) printnl(result.stdout);
    if (result.stderr) printErrnl(result.stderr);
    if (result.exitcode != 0) throw "Documentation generation failed: " + result.exitcode;
